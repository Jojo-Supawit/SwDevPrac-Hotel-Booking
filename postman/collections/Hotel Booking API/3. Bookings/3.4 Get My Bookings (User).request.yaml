$kind: http-request
url: "{{URL}}/api/v1/bookings"
method: GET
headers:
  Authorization: Bearer {{USER_TOKEN}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Returns only current user bookings', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.count).to.be.at.least(2);
      });
    language: text/javascript
order: 4000
