$kind: http-request
url: "{{URL}}/api/v1/bookings/{{BOOKING_ID}}"
method: GET
headers:
  Authorization: Bearer {{USER_TOKEN}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Booking data matches ID', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.data._id).to.eql(pm.collectionVariables.get('BOOKING_ID'));
      });
    language: text/javascript
order: 5000
