$kind: http-request
url: '{{URL}}/api/v1/bookings'
method: GET
headers:
  Authorization: Bearer {{TOKEN}}
description: 'User sees own bookings; Admin sees all. Runner: next Get Bookings for Hotel.'
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status 200', () => pm.response.to.have.status(200));

      pm.test('Response below 3 seconds', () => pm.expect(pm.response.responseTime).to.be.below(3000));

      pm.test('Success response', () => pm.expect(pm.response.json().success).to.be.true);

      pm.test('Booking list', () => pm.expect(pm.response.json().data).to.be.an('array'));


      // Runner flow (like VacQ)

      let runnerOK = pm.response.code === 200;

      if (runnerOK) {
        try { runnerOK = pm.response.json().success === true; } catch (err) { runnerOK = false; }
      }

      pm.execution.setNextRequest(runnerOK ? "Get Bookings for Hotel" : null);
    language: text/javascript
order: 4000
