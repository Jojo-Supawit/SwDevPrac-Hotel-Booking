$kind: http-request
url: "{{URL}}/api/v1/bookings/trigger-cron"
method: POST
headers:
  Authorization: Bearer {{ADMIN_TOKEN}}
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Cron job executes and returns transition/reminder results", function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.data).to.have.property("transitionedCount");
          pm.expect(res.data).to.have.property("remindersSentCount");
      });
    language: text/javascript
order: 10000
