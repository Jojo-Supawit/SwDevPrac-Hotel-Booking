$kind: http-request
url: '{{URL}}/api/v1/bookings/{{BOOKING_ID}}'
method: DELETE
headers:
  Authorization: Bearer {{TOKEN}}
description: |-
  Owner or Admin token required. Reuse this request for both roles and keep it until after the PDF demo.
  Runner: stop after this request.
scripts:
  - type: afterResponse
    code: >-
      if (pm.response.code === 200 && pm.response.json().success === true)
      pm.collectionVariables.set('BOOKING_ID', '');

      pm.test('Status 200', () => pm.response.to.have.status(200));

      pm.test('Response below 3 seconds', () => pm.expect(pm.response.responseTime).to.be.below(3000));

      pm.test('Success response', () => pm.expect(pm.response.json().success).to.be.true);


      pm.execution.setNextRequest(null);
    language: text/javascript
order: 6000
