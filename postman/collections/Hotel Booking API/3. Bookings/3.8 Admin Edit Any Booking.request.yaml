$kind: http-request
url: "{{URL}}/api/v1/bookings/{{BOOKING_ID}}"
method: PUT
headers:
  Authorization: Bearer {{ADMIN_TOKEN}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "nights": 3
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Admin edits booking nights to 3', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.data.nights).to.eql(3);
      });
    language: text/javascript
order: 8000
