$kind: http-request
url: "{{URL}}/api/v1/bookings/{{COMPLETED_BOOKING_ID}}/invoice"
method: GET
headers:
  Authorization: Bearer {{ADMIN_TOKEN}}
scripts:
  - type: beforeRequest
    code: |-
      pm.sendRequest({
          url: pm.collectionVariables.get("URL") + "/api/v1/bookings",
          method: "GET",
          header: { Authorization: "Bearer " + pm.collectionVariables.get("ADMIN_TOKEN") }
      }, function (err, res) {
          if (!err && res.code === 200) {
              const json = res.json();
              const completed = json.data.find(b => b.status === "Completed");
              if (completed) {
                  pm.collectionVariables.set("COMPLETED_BOOKING_ID", completed._id);
              }
          }
      });
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Content-Type is application/pdf", function () {
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/pdf");
      });
      pm.test("Content-Disposition is attachment with invoice filename", function () {
          pm.expect(pm.response.headers.get("Content-Disposition")).to.include("attachment");
      });
    language: text/javascript
order: 11000
