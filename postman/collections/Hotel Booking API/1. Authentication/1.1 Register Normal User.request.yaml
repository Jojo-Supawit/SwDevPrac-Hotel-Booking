$kind: http-request
url: "{{URL}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name": "John Doe",
        "telephoneNumber": "0812345678",
        "email": "{{USER_EMAIL}}",
        "password": "password123"
    }
scripts:
  - type: beforeRequest
    code: |-
      const ts = Date.now();
      const email = 'user_' + ts + '@example.com';
      pm.collectionVariables.set('USER_EMAIL', email);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('User registration returns token', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.token).to.be.a('string');
          pm.collectionVariables.set('USER_TOKEN', res.token);
      });
    language: text/javascript
order: 1000
