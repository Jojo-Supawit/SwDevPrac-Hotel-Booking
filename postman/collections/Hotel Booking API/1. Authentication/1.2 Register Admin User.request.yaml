$kind: http-request
url: "{{URL}}/api/v1/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name": "Admin User",
        "telephoneNumber": "0899999999",
        "email": "{{ADMIN_EMAIL}}",
        "password": "password123",
        "role": "admin"
    }
scripts:
  - type: beforeRequest
    code: |-
      const ts = Date.now();
      const email = 'admin_' + ts + '@example.com';
      pm.collectionVariables.set('ADMIN_EMAIL', email);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Admin registration returns token and role admin', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.token).to.be.a('string');
          pm.collectionVariables.set('ADMIN_TOKEN', res.token);
      });
    language: text/javascript
order: 2000
