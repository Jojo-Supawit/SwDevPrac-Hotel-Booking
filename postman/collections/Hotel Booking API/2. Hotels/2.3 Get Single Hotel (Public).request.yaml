$kind: http-request
url: "{{URL}}/api/v1/hotels/{{HOTEL_ID}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Single hotel data returned matches ID', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.data._id).to.eql(pm.collectionVariables.get('HOTEL_ID'));
      });
    language: text/javascript
order: 3000
