$kind: http-request
url: "{{URL}}/api/v1/hotels/{{HOTEL_ID}}"
method: PUT
headers:
  Authorization: Bearer {{ADMIN_TOKEN}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
        "name": "Grand Hyatt Erawan Bangkok Luxury"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Hotel updated successfully', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.data.name).to.eql('Grand Hyatt Erawan Bangkok Luxury');
      });
    language: text/javascript
order: 4000
