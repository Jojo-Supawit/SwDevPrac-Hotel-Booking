$kind: http-request
url: "{{URL}}/api/v1/hotels"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Hotels list returned without exposing user bookings (Confidentiality)', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.data).to.be.an('array');
          if (res.data.length > 0) {
              pm.expect(res.data[0].bookings).to.be.undefined;
          }
      });
    language: text/javascript
order: 2000
