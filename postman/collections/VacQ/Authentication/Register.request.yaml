$kind: http-request
url: "{{URL}}/api/v1/auth/register"
method: POST
headers:
  - key: Content-Type
    value: application/json
    description: JSON Type
body:
  type: json
  content: "{\r

    \    \"name\": \"Admin\",\r

    \    \"email\": \"admin@gmail.com\",\r

    \    \"password\": \"12345678\",\r

    \    \"role\": \"admin\"\r

    }"
scripts:
  - type: afterResponse
    code: pm.environment.set("TOKEN", pm.response.json().token)
    language: text/javascript
order: 1000
