$kind: http-request
url: "{{URL}}/api/v1/auth/logout"
method: GET
headers:
  - key: Content-Type
    value: application/json
    description: JSON Type
body:
  type: json
  content: "{\r

    \    \"email\": \"john@gmail.com\",\r

    \    \"password\": \"123456\"\r

    }"
auth:
  type: bearer
  credentials:
    token: "{{TOKEN}}"
scripts:
  - type: afterResponse
    code: pm.environment.set("TOKEN", null)
    language: text/javascript
order: 4000
