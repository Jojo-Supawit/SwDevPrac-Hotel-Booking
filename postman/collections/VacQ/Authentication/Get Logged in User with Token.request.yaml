$kind: http-request
url: "{{URL}}/api/v1/auth/me"
method: GET
headers:
  - key: Content-Type
    value: application/json
    description: JSON Type
  - key: Authorization
    value: Bearer {{json_web_token_0pxb}}
    disabled: true
auth:
  type: bearer
  credentials:
    token: "{{TOKEN}}"
order: 3000
