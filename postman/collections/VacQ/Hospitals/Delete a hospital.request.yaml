$kind: http-request
url: "{{URL}}/api/v1/hospitals/:hospital_ID"
method: DELETE
pathVariables:
  hospital_ID: "{{global_hospital_ID}}"
auth:
  type: bearer
  credentials:
    token: "{{TOKEN}}"
scripts:
  - type: afterResponse
    code: "pm.test(\"Status code is 200\", function () {\r

      \    pm.response.to.have.status(200);\r

      });\r

      \r

      pm.execution.setNextRequest(null)"
    language: text/javascript
order: 5000
