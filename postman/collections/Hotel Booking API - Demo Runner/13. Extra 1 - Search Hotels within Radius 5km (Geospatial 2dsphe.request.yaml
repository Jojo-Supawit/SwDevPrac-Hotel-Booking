$kind: http-request
name: 13. Extra 1 - Search Hotels within Radius 5km (Geospatial 2dsphere)
url: "{{URL}}/api/v1/hotels/radius/13.7367/100.5604/5"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Geospatial query returns hotels and excludes Pattaya hotel', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.count).to.be.above(0);
          const hasPattaya = res.data.some(h => (h.name && h.name.includes('Pattaya')) || (h.province && h.province.includes('Chonburi')));
          pm.expect(hasPattaya).to.be.false;
      });
    language: text/javascript
order: 16000
