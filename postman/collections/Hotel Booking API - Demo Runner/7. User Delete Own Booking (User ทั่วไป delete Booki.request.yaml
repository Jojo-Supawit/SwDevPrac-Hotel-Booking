$kind: http-request
name: 7. User Delete Own Booking (User ทั่วไป delete Booking)
url: "{{URL}}/api/v1/bookings/{{USER_BOOKING_1_ID}}"
method: DELETE
headers:
  Authorization: Bearer {{USER_TOKEN}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('User booking deleted successfully', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
      });
    language: text/javascript
order: 10000
