$kind: http-request
name: 10. Admin View Any Booking (แสดง Booking ที่สร้างไว้)
url: "{{URL}}/api/v1/bookings"
method: GET
headers:
  Authorization: Bearer {{ADMIN_TOKEN}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status code is 200 OK', function () {
          pm.response.to.have.status(200);
      });
      pm.test('Admin views all bookings with populated user details', function () {
          const res = pm.response.json();
          pm.expect(res.success).to.be.true;
          pm.expect(res.count).to.be.above(0);
          const b2 = res.data.find(b => b._id === pm.collectionVariables.get('USER_BOOKING_2_ID'));
          pm.expect(b2).to.not.be.undefined;
          pm.expect(b2.user).to.have.property('name');
      });
    language: text/javascript
order: 13000
